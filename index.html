<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayshi Chatbot</title>
    <style>
        body {
            background-color: red;
            margin: 0;
            font-family: 'Times New Roman', serif;
            color: #333;
            padding: 20px;
        }
        .chat-window {
            width: 90%;
            max-width: 600px;
            margin: auto;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .message {
            margin: 10px 0;
        }
        header {
            background-color: #232b26;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        footer p {
            margin: 0;
            font-size: 1em;
        }
        button {
            background-color: #ff4500;
            color: #fff;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #ff6347;
        }
        input[type="text"] {
            width: calc(100% - 22px);
            padding: 10px;
            font-size: 1em;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Rayshi Chatbot</h1>
    </header>
    <div class="chat-window">
        <div id="chat"></div>
        <input id="userMessage" type="text" placeholder="Type your message here..." />
        <button onclick="sendMessage()">Send</button>
    </div>
    <footer>
        <p>&copy; 2024 RAYSHI. All rights reserved.</p>
    </footer>
    <script>
        function sendMessage() {
            // Function logic yet to be implemented
        }
    </script>
</body>
</html>
